---
# Run against the machine you are sitting at:
#   ansible-playbook site.yml
#
# Run against a remote machine (add it under `remote` below):
#   ansible-playbook site.yml -l new-laptop
all:
  children:
    workstations:
      children:
        local:
          hosts:
            localhost:
              ansible_connection: local
        remote:
          hosts: {}
          # new-laptop:
          #   ansible_host: 192.168.1.50
          #   ansible_user: lander2k2
